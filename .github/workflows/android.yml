name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.godot"
      - "export_presets.cfg"
      - ".github/workflows/android.yml"

jobs:
  build-android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export debug APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/RobotWorkshop.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RobotWorkshop-Android
          path: build/RobotWorkshop.apk
          if-no-files-found: error
